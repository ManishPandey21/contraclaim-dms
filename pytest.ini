[pytest]
testpaths = backend/rbac_backend/tests
python_files = test_*.py
python_functions = test_*
addopts = -ra
norecursedirs =
    .git
    .venv
    venv
    archive
    backend/archive
    backend/rbac_backend/manual
    logs
    uploads
    tmp
    __pycache__
markers =
    asyncio: coroutine test executed by the local pytest async bridge
    integration: multi-library or service-boundary test that should be CI-safe by default
    external_service: exercises the OpenAI, Qdrant, or Redis/Falkor integration surface
    live_external_service: opt-in smoke test against real OpenAI, Qdrant, or Redis/Falkor infrastructure
    manual: developer-run validation script, excluded from automated suites
