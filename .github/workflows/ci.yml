name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write
  # R-A8T, from the first run this repository ever gave this branch.
  # `gitleaks-action@v2` calls `GET /repos/{owner}/{repo}/pulls/{n}/commits` to
  # scope a pull-request scan, and without this it answers
  # `403 Resource not accessible by integration` and the job dies before
  # scanning anything - a red `secret-scan` that had found nothing either way.
  # Read-only, and the narrowest scope that makes the call succeed.
  pull-requests: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  DATABASE_URL: mongodb://localhost:27017/contraclaim
  SECRET_KEY: ci-secret-key-at-least-32-characters
  AWS_ACCESS_KEY_ID: ci-access-key-id
  AWS_SECRET_ACCESS_KEY: ci-secret-access-key
  AWS_BUCKET_NAME: ci-bucket
  AWS_REGION: ap-south-1
  OPENAI_API_KEY: ci-openai-key
  SMTP_USERNAME: ci@example.com
  SMTP_PASSWORD: ci-password
  SMTP_FROM_EMAIL: ci@example.com
  LANGGRAPH_API_TOKEN: ci-langgraph-token
  CONTRACT_QUEUE_ENABLED: "false"
  FALKORDB_ENABLED: "false"
  ALLOW_DEV_HEADERS: "false"
  RBAC_ENTITLEMENT_FAIL_OPEN: "false"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-checks:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: projectDMS/backend/rbac_backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit pytest pytest-asyncio
          pip install -r projectDMS/backend/rbac_backend/requirements.txt
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Compile backend modules
        run: python -m compileall -q projectDMS/backend/rbac_backend
      # Twenty-two test modules import `backend.rbac_backend...`, which resolves
      # only when `projectDMS` is on sys.path. Invoked as `pytest <path>` from
      # the checkout root it is not, and collection dies with
      # `ModuleNotFoundError: No module named 'backend'` before a single test
      # runs. `python -m` puts the working directory on sys.path, so running it
      # from `projectDMS` reproduces the invocation the repository documents.
      - name: Run backend test suite
        working-directory: projectDMS
        run: python -m pytest backend/rbac_backend/tests -q

  frontend-checks:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projectDMS/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: projectDMS/client/package-lock.json
      # Recorded, not assumed. `client/.npmrc` sets engine-strict so an npm
      # outside the supported range already fails `npm ci` at the engine check
      # (F-A8M-4); printing the versions puts the toolchain that produced this
      # evidence into the log, where a later phase can read it.
      - name: Record the client toolchain
        run: node --version && npm --version
      - run: npm ci
      # `npm ci` must never rewrite the lockfile. Under an npm major that
      # disagrees with it the install either fails at the engine check
      # (`client/.npmrc`) or, historically, resolved a different tree - and a
      # rewritten lockfile is the visible symptom of the second. Asserted here
      # rather than left to a phase to notice by hand (F-A8M-4).
      - name: The lockfile is unchanged by installing it
        run: git diff --exit-code -- package-lock.json
      - run: npm run lint
      - name: Run frontend tests
        # vitest runs files serially (fileParallelism: false in vitest.config.ts
        # to avoid a parallel-run deadlock). That reuses one fork worker for the
        # whole suite, whose V8 heap accumulates across files, so give it headroom
        # to avoid an end-of-run OOM. Fork workers inherit NODE_OPTIONS.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm test -- --run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan Python dependencies
        # PYSEC-2026-3740 (CVE-2026-81726, GHSA-8mgp-746c-j5xp) is a path-sandbox
        # bypass in NLTK's model-artifact APIs with no published fix in any
        # release. It is accepted for THIS release only, on the reachability
        # evidence and the review triggers recorded in
        # projectDMS/docs/NOFIX_ADVISORY_ACCEPTANCE.md, and pinned by
        # projectDMS/backend/rbac_backend/tests/test_nltk_advisory_reachability.py.
        #
        # Exactly one advisory id, never a package or a severity: a second NLTK
        # advisory, or any other finding, still fails this job. pip-audit prints
        # "1 ignored" on every run, so the exception stays visible in the log.
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r projectDMS/backend/rbac_backend/requirements.txt --ignore-vuln PYSEC-2026-3740
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: projectDMS/client/package-lock.json
      - name: Scan frontend dependencies
        working-directory: projectDMS/client
        run: |
          node --version && npm --version
          npm ci
          git diff --exit-code -- package-lock.json
          npm audit --audit-level=high

  docker-build-and-scan:
    name: Docker build and image scan
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v4
      # The job built all five images and then scanned all five, and on
      # 2026-09-09 it died on the first scan with
      # `write /tmp/trivy-.../docker-export-...: no space left on device` -
      # Trivy exports a layer to disk to analyse it, and by then five images
      # were already resident. Nothing about the images had changed; the job had
      # simply outgrown a hosted runner. Restructured to build, scan and drop
      # one image at a time, so peak disk holds one image rather than five.
      #
      # Coverage is identical: the same five builds, the same client
      # package-manager class check, and the same five scans at CRITICAL,HIGH
      # with `exit-code: 1`. Nothing was excluded to make it fit.
      - name: Reclaim runner disk
        # A hosted runner ships ~25 GB of toolchains this job never uses. Freed
        # before the first build rather than between failures.
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af --volumes || true
          df -h / | tail -1
      # langgraph, graphiti and docling are profile-gated in compose, but their
      # Python runtime is still built on every change so a 3.12 incompatibility
      # cannot stay hidden until an operator enables the profile.
      - name: Build the backend image
        run: docker build -t projectdms-backend:${{ github.sha }} projectDMS/backend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: projectdms-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Drop the backend image
        run: docker image rm projectdms-backend:${{ github.sha }}
      - name: Build the client image
        run: docker build -t projectdms-client:${{ github.sha }} projectDMS/client
      - name: Client runtime image carries no package manager
        # The client image serves static files with `node scripts/serve-dist.mjs`.
        # node:*-slim bundles npm, corepack and yarn, and npm's vendored
        # dependency tree was the source of every Node-side finding in this
        # image - one CRITICAL and nineteen HIGH, none of them from the
        # application's own dependencies. Trivy gates on severity; this gates on
        # the class, so the finding cannot come back the moment an advisory is
        # re-scored or a fix is published.
        run: |
          set -euo pipefail
          image=projectdms-client:${{ github.sha }}
          for binary in npm npx corepack yarn yarnpkg; do
            if docker run --rm --user 0 --entrypoint sh "$image" \
                 -c "command -v $binary" >/dev/null 2>&1; then
              echo "FAIL: $binary is present in the client runtime image" >&2
              exit 1
            fi
          done
          remaining=$(docker run --rm --user 0 --entrypoint sh "$image" \
            -c 'ls -A /usr/local/lib/node_modules 2>/dev/null | wc -l')
          if [ "$remaining" != "0" ]; then
            echo "FAIL: /usr/local/lib/node_modules is not empty ($remaining entries)" >&2
            docker run --rm --user 0 --entrypoint sh "$image" -c 'ls -A /usr/local/lib/node_modules' >&2
            exit 1
          fi
          for leaked in /app/node_modules /app/src /app/package.json /app/package-lock.json; do
            if docker run --rm --user 0 --entrypoint sh "$image" \
                 -c "test -e $leaked" >/dev/null 2>&1; then
              echo "FAIL: builder artefact $leaked reached the runtime image" >&2
              exit 1
            fi
          done
          docker run --rm --entrypoint node "$image" --version
          echo "OK: runtime image has node, no package manager, no builder artefacts"
      - name: Scan client image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: projectdms-client:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Drop the client image
        run: docker image rm projectdms-client:${{ github.sha }}
      - name: Build the LangGraph image
        run: docker build -t projectdms-langgraph:${{ github.sha }} projectDMS/services/langgraph
      - name: Scan LangGraph image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: projectdms-langgraph:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Drop the LangGraph image
        run: docker image rm projectdms-langgraph:${{ github.sha }}
      - name: Build the Graphiti image
        run: docker build -t projectdms-graphiti:${{ github.sha }} projectDMS/services/graphiti
      - name: Scan Graphiti image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: projectdms-graphiti:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Drop the Graphiti image
        run: docker image rm projectdms-graphiti:${{ github.sha }}
      - name: Build the Docling image
        run: docker build -t projectdms-docling:${{ github.sha }} projectDMS/services/docling
      - name: Scan Docling image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: projectdms-docling:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Drop the Docling image
        run: docker image rm projectdms-docling:${{ github.sha }}
