repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: ["--fix"]
        files: "^backend/rbac_backend/(ingestion|retrieval|agents|observability)/.*\\.py$|^backend/rbac_backend/routers/retrieval_engine.py$|^backend/rbac_backend/tests/test_retrieval_engine_basics.py$"
      - id: ruff-format
        files: "^backend/rbac_backend/(ingestion|retrieval|agents|observability)/.*\\.py$|^backend/rbac_backend/routers/retrieval_engine.py$|^backend/rbac_backend/tests/test_retrieval_engine_basics.py$"

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: "^backend/rbac_backend/(ingestion|retrieval|agents|observability)/"
        additional_dependencies: []

  - repo: local
    hooks:
      - id: forbid-print
        name: "Forbid print in backend"
        entry: python -c "import sys,pathlib; bad=[p for p in sys.argv[1:] if pathlib.Path(p).suffix=='.py' and 'print(' in pathlib.Path(p).read_text()]; sys.exit(1 if bad else 0)"
        language: system
        types: [python]
        files: "^backend/rbac_backend/(ingestion|retrieval|agents|observability)/.*\\.py$"

      # Prevents reintroducing the archived/scratch/duplicate files removed in the
      # hotfix #2 dead-code cleanup. Fails if any matching path is staged.
      - id: forbid-dead-code-paths
        name: "Forbid archived/scratch/duplicate files"
        entry: "Reintroducing archived, scratch, or duplicated files is not allowed (see hotfix #2 cleanup)"
        language: fail
        files: '(^|/)archive/|(^|/)main_minimal\.py$|New Text Document| - Copy| copy\.py$|_1509\.|_1511\.|_tranculated\.|(^|/)UploadPage1\.|(^|/)UploadPage_check\.|(^|/)DocumentViewerPageOriginal\.|(^|/)PermissionsPageImproved\.|(^|/)Dashboard1\.|(^|/)useLetterWorkflow[0-9]\.'

      # Week-1 authz consolidation: forbid reintroducing the removed legacy
      # has_permission dependency and any import of the deleted archive package.
      # Use require_permission / PolicyService instead (see docs/AUTHZ.md).
      - id: forbid-legacy-authz
        name: "Forbid legacy has_permission dependency and archive imports"
        entry: 'Depends\(has_permission\(|(from|import) [\w.]*\barchive\b'
        language: pygrep
        files: '\.(py|ts|tsx)$'
