name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit pytest
          pip install -r backend/rbac_backend/requirements.txt

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run unit tests
        run: pytest backend/rbac_backend/tests/test_retrieval_engine_basics.py
