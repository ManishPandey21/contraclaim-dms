x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_REDIS_URL: "redis://redis:6379/1"
      RUNTIME_STATE_REDIS_URL: "redis://redis:6379/1"
      CONTRACT_QUEUE_REDIS_URL: "redis://redis:6379/0"
      GRAPH_PROVIDER: "direct_falkor"
      FALKORDB_ENABLED: "true"
      FALKORDB_HOST: "falkordb"
      FALKORDB_PORT: "6379"
      FALKORDB_URL: "redis://falkordb:6379"
      FALKORDB_GRAPH_NAME: "contraclaim"
      FALKORDB_PASSWORD: ""
      GRAPHITI_ENABLED: "false"
      LANGGRAPH_ENABLED: "false"
      START_CONTRACT_QUEUE_WORKERS: "false"
      # H2: cron jobs run in the worker, not the web tier (leader-locked either way).
      RUN_SCHEDULER: "false"
    depends_on:
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - service-net
      - data-net
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    env_file:
      - ./client/.env.development
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge-net
      - service-net
    ports:
      - "3000:5173"
    logging: *default-logging

  contract-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "rbac_backend.worker"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_REDIS_URL: "redis://redis:6379/1"
      RUNTIME_STATE_REDIS_URL: "redis://redis:6379/1"
      CONTRACT_QUEUE_REDIS_URL: "redis://redis:6379/0"
      GRAPH_PROVIDER: "direct_falkor"
      FALKORDB_ENABLED: "true"
      FALKORDB_HOST: "falkordb"
      FALKORDB_PORT: "6379"
      FALKORDB_URL: "redis://falkordb:6379"
      FALKORDB_GRAPH_NAME: "contraclaim"
      FALKORDB_PASSWORD: ""
      GRAPHITI_ENABLED: "false"
      LANGGRAPH_ENABLED: "false"
      START_BACKGROUND_SERVICES: "false"
      START_CONTRACT_QUEUE_WORKERS: "true"
      # H2: single owner of the leader-locked cron jobs.
      RUN_SCHEDULER: "true"
    depends_on:
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - service-net
      - data-net
    logging: *default-logging

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --quiet --eval "db.adminCommand(''ping'')"']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY}"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: "INFO"
      QDRANT__STORAGE__SNAPSHOT_PATH: "/qdrant/snapshots"
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    secrets:
      - qdrant_api_key
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    command:
      - "--save"
      - "900"
      - "1"
      - "300"
      - "10"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "2gb"
      - "--maxmemory-policy"
      - "volatile-lru"
    ports:
      - "6380:6379"
    volumes:
      - falkordb_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - service-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  graphiti:
    profiles: ["graph-experimental"]
    build:
      context: ./services/graphiti
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GRAPHITI_DB_URL: "redis://falkordb:6379"
      GRAPHITI_QDRANT_URL: "http://qdrant:6333"
      GRAPHITI_QDRANT_API_KEY: "${QDRANT_API_KEY}"
      GRAPHITI_OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GRAPHITI_GRAPH_NAME: "contraclaim"
    depends_on:
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    networks:
      - service-net
      - data-net
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  clamav:
    image: clamav/clamav:latest
    container_name: cc-clamav
    restart: always
    ports:
      - "3310:3310"
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - service-net
    logging: *default-logging

  gateway:
    image: httpd:2.4
    restart: unless-stopped
    depends_on:
      client:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./config/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./config/health.txt:/usr/local/apache2/htdocs/health.txt:ro
    networks:
      - edge-net
      - service-net
    logging: *default-logging

volumes:
  mongo_data:
  qdrant_data:
  qdrant_snapshots:
  falkordb_data:
  redis_data:

networks:
  data-net:
    driver: bridge
  service-net:
    driver: bridge
  edge-net:
    driver: bridge

secrets:
  qdrant_api_key:
    file: ./config/secrets/qdrant_api_key
