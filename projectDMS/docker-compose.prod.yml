x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  ENVIRONMENT: "production"
  ENABLE_API_DOCS: "false"
  ALLOW_DEV_HEADERS: "false"
  DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must point to the production MongoDB replica set}"
  MONGODB_URI: "${DATABASE_URL:?DATABASE_URL must point to the production MongoDB replica set}"
  MONGODB_DATABASE: "${MONGODB_DATABASE:-contraclaim}"
  MONGODB_REPLICA_SET: "${MONGODB_REPLICA_SET:?MONGODB_REPLICA_SET is required in production}"
  MONGODB_RETRY_WRITES: "${MONGODB_RETRY_WRITES:-true}"
  MONGODB_ALLOW_STANDALONE_PRODUCTION: "false"
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
  AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-cc_access_token}"
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAMESITE: "${AUTH_COOKIE_SAMESITE:-lax}"
  AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN:-}"
  # C2: deny auth (503) while the session store is unreachable so revoked
  # sessions cannot outlive a Redis outage. false = availability tradeoff.
  AUTH_SESSION_FAIL_CLOSED: "${AUTH_SESSION_FAIL_CLOSED:-true}"
  CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required}"
  PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}"
  PUBLIC_API_URL: "${PUBLIC_API_URL:-${PUBLIC_BASE_URL}/api}"
  APP_URL: "${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}"
  AWS_REGION: "${AWS_REGION:-ap-south-1}"
  AWS_BUCKET_NAME: "${AWS_BUCKET_NAME:?AWS_BUCKET_NAME is required}"
  SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USERNAME: "${SMTP_USERNAME:?SMTP_USERNAME is required}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:?SMTP_PASSWORD is required}"
  SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL is required}"
  SMTP_SETTINGS_ENCRYPTION_KEY: "${SMTP_SETTINGS_ENCRYPTION_KEY:?SMTP_SETTINGS_ENCRYPTION_KEY is required}"
  PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-noop}"
  RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
  RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
  RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:-}"
  APP_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1"
  RUNTIME_STATE_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1"
  CONTRACT_QUEUE_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0"
  FALKORDB_URL: "redis://:${FALKORDB_PASSWORD:?FALKORDB_PASSWORD is required}@falkordb:6379"
  FALKORDB_ENABLED: "${FALKORDB_ENABLED:-true}"
  FALKORDB_HOST: "falkordb"
  FALKORDB_PORT: "6379"
  FALKORDB_GRAPH_NAME: "contraclaim"
  FALKORDB_CLEANUP_REFERENCES: "${FALKORDB_CLEANUP_REFERENCES:-true}"
  FALKORDB_PASSWORD: "${FALKORDB_PASSWORD:?FALKORDB_PASSWORD is required}"
  GRAPH_PROVIDER: "direct_falkor"
  GRAPHITI_ENABLED: "false"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required}"
  QDRANT_COLLECTION: "${QDRANT_COLLECTION:-document_vectors}"
  QDRANT_VECTOR_SIZE: "${QDRANT_VECTOR_SIZE:-1536}"
  QDRANT_DISTANCE: "${QDRANT_DISTANCE:-cosine}"
  QDRANT_VECTOR_NAME: "${QDRANT_VECTOR_NAME:-}"
  VECTORDB_URL: "http://qdrant:6333"
  VECTORDB_API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required}"
  # Not `:?`. LANGGRAPH_ENABLED defaults to false and this file defines no
  # langgraph service, so hard-requiring the token made `docker compose config`
  # fail for a service that is not running - which is why the only placeholder
  # in R-A8I's staging render was this variable. The requirement lives where it
  # can see the switch: `config.py` refuses a production start with
  # LANGGRAPH_ENABLED=true and no token, and `verify_langgraph_token` rejects
  # every call when none is configured.
  LANGGRAPH_API_TOKEN: "${LANGGRAPH_API_TOKEN:-}"
  LANGGRAPH_ENABLED: "${LANGGRAPH_ENABLED:-false}"
  # The official in-process LangGraph drafting engine is selected entirely on
  # the server. Keep the safe v2/off defaults until an explicit rollout is
  # configured in the production environment.
  DRAFT_ENGINE_DEFAULT: "${DRAFT_ENGINE_DEFAULT:-v2}"
  DRAFT_ENGINE_ROLLOUT_MODE: "${DRAFT_ENGINE_ROLLOUT_MODE:-off}"
  DRAFT_ENGINE_CANARY_PERCENT: "${DRAFT_ENGINE_CANARY_PERCENT:-0}"
  DRAFT_ENGINE_CANARY_TENANT_IDS: "${DRAFT_ENGINE_CANARY_TENANT_IDS:-}"
  DRAFT_ENGINE_SHADOW_ENABLED: "${DRAFT_ENGINE_SHADOW_ENABLED:-false}"
  DRAFT_ENGINE_GRAPH_VERSION: "${DRAFT_ENGINE_GRAPH_VERSION:-v3}"
  DRAFT_ENGINE_STATE_SCHEMA_VERSION: "${DRAFT_ENGINE_STATE_SCHEMA_VERSION:-1}"
  DRAFT_ENGINE_PRODUCTION_ACCEPTED: "${DRAFT_ENGINE_PRODUCTION_ACCEPTED:-false}"
  DRAFT_ENGINE_MAX_CHECKPOINT_BYTES: "${DRAFT_ENGINE_MAX_CHECKPOINT_BYTES:-262144}"
  DRAFT_ENGINE_CHECKPOINT_RETENTION_DAYS: "${DRAFT_ENGINE_CHECKPOINT_RETENTION_DAYS:-30}"
  # Arbitration LangGraph remains non-primary until Phase-5 production-like
  # acceptance is complete. Pause and force-v2 lists are emergency controls.
  ARBITRATION_ENGINE_DEFAULT: "${ARBITRATION_ENGINE_DEFAULT:-arbitration_v2}"
  ARBITRATION_ENGINE_ROLLOUT_MODE: "${ARBITRATION_ENGINE_ROLLOUT_MODE:-off}"
  ARBITRATION_ENGINE_CANARY_PERCENT: "${ARBITRATION_ENGINE_CANARY_PERCENT:-0}"
  ARBITRATION_ENGINE_CANARY_TENANT_IDS: "${ARBITRATION_ENGINE_CANARY_TENANT_IDS:-}"
  ARBITRATION_ENGINE_CANARY_PROJECT_IDS: "${ARBITRATION_ENGINE_CANARY_PROJECT_IDS:-}"
  ARBITRATION_ENGINE_FORCE_V2_TENANT_IDS: "${ARBITRATION_ENGINE_FORCE_V2_TENANT_IDS:-}"
  ARBITRATION_ENGINE_FORCE_V2_PROJECT_IDS: "${ARBITRATION_ENGINE_FORCE_V2_PROJECT_IDS:-}"
  ARBITRATION_ENGINE_ROLLOUT_PAUSED: "${ARBITRATION_ENGINE_ROLLOUT_PAUSED:-false}"
  ARBITRATION_ENGINE_GRAPH_VERSION: "${ARBITRATION_ENGINE_GRAPH_VERSION:-phase6-node-owned-v1}"
  ARBITRATION_ENGINE_STATE_SCHEMA_VERSION: "${ARBITRATION_ENGINE_STATE_SCHEMA_VERSION:-2}"
  ARBITRATION_ENGINE_PRODUCTION_ACCEPTED: "${ARBITRATION_ENGINE_PRODUCTION_ACCEPTED:-false}"
  ARBITRATION_ENGINE_ACCEPTANCE_RECEIPT_ID: "${ARBITRATION_ENGINE_ACCEPTANCE_RECEIPT_ID:-}"
  ARBITRATION_ENGINE_ACCEPTANCE_RECEIPT_SHA256: "${ARBITRATION_ENGINE_ACCEPTANCE_RECEIPT_SHA256:-}"
  ARBITRATION_ENGINE_PRIMARY_PERCENT: "${ARBITRATION_ENGINE_PRIMARY_PERCENT:-0}"
  ARBITRATION_ENGINE_PRIMARY_TENANT_IDS: "${ARBITRATION_ENGINE_PRIMARY_TENANT_IDS:-}"
  ARBITRATION_ENGINE_PRIMARY_PROJECT_IDS: "${ARBITRATION_ENGINE_PRIMARY_PROJECT_IDS:-}"
  ARBITRATION_ENGINE_PRIMARY_REQUIRE_HEALTH_READY: "${ARBITRATION_ENGINE_PRIMARY_REQUIRE_HEALTH_READY:-true}"
  ARBITRATION_ENGINE_MIN_PLEADING_TYPE_SAMPLE: "${ARBITRATION_ENGINE_MIN_PLEADING_TYPE_SAMPLE:-1}"
  ARBITRATION_ENGINE_ACCEPTANCE_WINDOW_RUNS: "${ARBITRATION_ENGINE_ACCEPTANCE_WINDOW_RUNS:-500}"
  ARBITRATION_ENGINE_V2_COMPATIBILITY_MODE: "${ARBITRATION_ENGINE_V2_COMPATIBILITY_MODE:-active}"
  ARBITRATION_ENGINE_V2_COMPATIBILITY_UNTIL: "${ARBITRATION_ENGINE_V2_COMPATIBILITY_UNTIL:-}"
  ARBITRATION_ENGINE_MAX_CHECKPOINT_BYTES: "${ARBITRATION_ENGINE_MAX_CHECKPOINT_BYTES:-262144}"
  ARBITRATION_ENGINE_CHECKPOINT_RETENTION_DAYS: "${ARBITRATION_ENGINE_CHECKPOINT_RETENTION_DAYS:-30}"
  ARBITRATION_ENGINE_RETRY_BUDGET: "${ARBITRATION_ENGINE_RETRY_BUDGET:-3}"
  ARBITRATION_ENGINE_EFFECT_LEASE_SECONDS: "${ARBITRATION_ENGINE_EFFECT_LEASE_SECONDS:-120}"
  ARBITRATION_ENGINE_EFFECT_MAX_ATTEMPTS: "${ARBITRATION_ENGINE_EFFECT_MAX_ATTEMPTS:-5}"
  ARBITRATION_ENGINE_MAX_REMEDIATION_CYCLES: "${ARBITRATION_ENGINE_MAX_REMEDIATION_CYCLES:-1}"
  ARBITRATION_ENGINE_MIN_ACCEPTANCE_SAMPLE: "${ARBITRATION_ENGINE_MIN_ACCEPTANCE_SAMPLE:-20}"
  ARBITRATION_ENGINE_MIN_SHADOW_PARITY_PERCENT: "${ARBITRATION_ENGINE_MIN_SHADOW_PARITY_PERCENT:-99}"
  ARBITRATION_ENGINE_MAX_FAILURE_RATE_PERCENT: "${ARBITRATION_ENGINE_MAX_FAILURE_RATE_PERCENT:-2}"
  ARBITRATION_ENGINE_MAX_FALLBACK_RATE_PERCENT: "${ARBITRATION_ENGINE_MAX_FALLBACK_RATE_PERCENT:-5}"
  ARBITRATION_ENGINE_MAX_PAUSE_HOURS: "${ARBITRATION_ENGINE_MAX_PAUSE_HOURS:-72}"
  DRAFTING_QUEUE_ENABLED: "${DRAFTING_QUEUE_ENABLED:-false}"
  DRAFTING_QUEUE_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1"
  DRAFTING_QUEUE_NAME: "${DRAFTING_QUEUE_NAME:-letter_drafting_queue}"
  DRAFTING_QUEUE_PROCESSING_NAME: "${DRAFTING_QUEUE_PROCESSING_NAME:-letter_drafting_processing}"
  DRAFTING_QUEUE_DEADLETTER_NAME: "${DRAFTING_QUEUE_DEADLETTER_NAME:-letter_drafting_deadletter}"
  DRAFTING_QUEUE_MAX_RETRIES: "${DRAFTING_QUEUE_MAX_RETRIES:-3}"
  DRAFTING_QUEUE_WORKERS: "${DRAFTING_QUEUE_WORKERS:-1}"
  DRAFTING_QUEUE_VISIBILITY_TIMEOUT_SECONDS: "${DRAFTING_QUEUE_VISIBILITY_TIMEOUT_SECONDS:-1800}"
  DRAFTING_QUEUE_HEARTBEAT_SECONDS: "${DRAFTING_QUEUE_HEARTBEAT_SECONDS:-30}"
  FILING_EXPORT_QUEUE_ENABLED: "${FILING_EXPORT_QUEUE_ENABLED:-true}"
  FILING_EXPORT_QUEUE_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1"
  FILING_EXPORT_QUEUE_NAME: "${FILING_EXPORT_QUEUE_NAME:-arbitration_filing_export_queue}"
  FILING_EXPORT_QUEUE_PROCESSING_NAME: "${FILING_EXPORT_QUEUE_PROCESSING_NAME:-arbitration_filing_export_processing}"
  FILING_EXPORT_QUEUE_DEADLETTER_NAME: "${FILING_EXPORT_QUEUE_DEADLETTER_NAME:-arbitration_filing_export_deadletter}"
  FILING_EXPORT_QUEUE_MAX_RETRIES: "${FILING_EXPORT_QUEUE_MAX_RETRIES:-3}"
  FILING_EXPORT_QUEUE_WORKERS: "${FILING_EXPORT_QUEUE_WORKERS:-2}"
  FILING_EXPORT_QUEUE_VISIBILITY_TIMEOUT_SECONDS: "${FILING_EXPORT_QUEUE_VISIBILITY_TIMEOUT_SECONDS:-300}"
  FILING_EXPORT_QUEUE_HEARTBEAT_SECONDS: "${FILING_EXPORT_QUEUE_HEARTBEAT_SECONDS:-20}"
  FILING_EXPORT_QUEUE_METADATA_TTL_SECONDS: "${FILING_EXPORT_QUEUE_METADATA_TTL_SECONDS:-604800}"
  METRICS_ENABLED: "${METRICS_ENABLED:-true}"
  METRICS_TOKEN: "${METRICS_TOKEN:?METRICS_TOKEN is required when metrics are enabled}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  SLOW_REQUEST_THRESHOLD_MS: "${SLOW_REQUEST_THRESHOLD_MS:-2000}"
  BACKUP_ROOT: "${BACKUP_ROOT:-/var/backups/contractdms}"
  BACKUP_MAX_AGE_HOURS: "${BACKUP_MAX_AGE_HOURS:-26}"
  BACKUP_REQUIRED_IN_PRODUCTION: "${BACKUP_REQUIRED_IN_PRODUCTION:-true}"
  BACKUP_REQUIRED_VOLUME_LABELS: "${BACKUP_REQUIRED_VOLUME_LABELS:-backend-uploads,qdrant-data,falkordb-data,redis-data}"
  BACKUP_S3_BUCKET: "${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required for production backups}"
  BACKUP_S3_PREFIX: "${BACKUP_S3_PREFIX:-contraclaim/backups}"
  UPLOADS_DIR: "/app/uploads"
  SECURE_UPLOADS_DIR: "/app/uploads"
  UPLOAD_STREAM_CHUNK_SIZE_MB: "${UPLOAD_STREAM_CHUNK_SIZE_MB:-1}"
  UPLOAD_VALIDATION_SAMPLE_BYTES: "${UPLOAD_VALIDATION_SAMPLE_BYTES:-8192}"
  GENERAL_UPLOAD_MAX_FILE_SIZE_MB: "${GENERAL_UPLOAD_MAX_FILE_SIZE_MB:-100}"
  UPLOAD_MAX_CONCURRENT_PER_USER: "${UPLOAD_MAX_CONCURRENT_PER_USER:-3}"
  UPLOAD_MAX_CONCURRENT_PER_ORG: "${UPLOAD_MAX_CONCURRENT_PER_ORG:-20}"
  ANTIVIRUS_ENABLED: "${ANTIVIRUS_ENABLED:-true}"
  ANTIVIRUS_REQUIRED_IN_PRODUCTION: "${ANTIVIRUS_REQUIRED_IN_PRODUCTION:-true}"
  CLAMAV_HOST: "${CLAMAV_HOST:-clamav}"
  CLAMAV_PORT: "${CLAMAV_PORT:-3310}"
  CLAMAV_TIMEOUT: "${CLAMAV_TIMEOUT:-30}"
  CLAMAV_FAIL_OPEN: "${CLAMAV_FAIL_OPEN:-false}"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Release identity: baked into the image (revision label + RELEASE_SHA
      # environment) by backend/Dockerfile, never set at `up`, so a recreated
      # container cannot claim a release its code is not. Build with
      # RELEASE_SHA="$(git rev-parse HEAD)" (OPERATIONS 7a); unset, the image
      # says `unknown` and post_deploy_verify.sh fails.
      args:
        RELEASE_SHA: "${RELEASE_SHA:-unknown}"
    restart: unless-stopped
    environment:
      <<: *backend-env
      START_BACKGROUND_SERVICES: "true"
      START_CONTRACT_QUEUE_WORKERS: "false"
      # Heavy OCR/extraction belongs on document-worker, not on the request
      # tier. START_BACKGROUND_SERVICES stays true here: it also gates cleanup,
      # assignment alerts, and subscription lifecycle.
      START_DOCUMENT_EXTRACTION_WORKERS: "false"
      # H2: the web tier must not run cron jobs (it may be scaled to >1 replica).
      # The contract-worker is the single scheduler owner; the leader lock is the
      # safety net if this is ever flipped on by mistake.
      RUN_SCHEDULER: "false"
    depends_on:
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - service-net
      - data-net
      - egress-net
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - ${BACKUP_ROOT:-/var/backups/contractdms}:${BACKUP_ROOT:-/var/backups/contractdms}:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      # Release identity baked into the image (client/Dockerfile).
      args:
        RELEASE_SHA: "${RELEASE_SHA:-unknown}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge-net
      - service-net
    expose:
      - "5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  contract-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Release identity: baked into the image (revision label + RELEASE_SHA
      # environment) by backend/Dockerfile, never set at `up`, so a recreated
      # container cannot claim a release its code is not. Build with
      # RELEASE_SHA="$(git rev-parse HEAD)" (OPERATIONS 7a); unset, the image
      # says `unknown` and post_deploy_verify.sh fails.
      args:
        RELEASE_SHA: "${RELEASE_SHA:-unknown}"
    restart: unless-stopped
    command: ["python", "-m", "rbac_backend.worker"]
    environment:
      <<: *backend-env
      START_BACKGROUND_SERVICES: "false"
      START_CONTRACT_QUEUE_WORKERS: "true"
      # Contract Master reprojection (PENDING -> CURRENT). Exactly one service
      # runs it; the claim lease keeps extra replicas safe, not useful.
      START_CONTRACT_REPROJECTION_WORKERS: "true"
      START_DOCUMENT_EXTRACTION_WORKERS: "false"
      START_DRAFTING_QUEUE_WORKERS: "${START_DRAFTING_QUEUE_WORKERS:-false}"
      START_FILING_EXPORT_QUEUE_WORKERS: "${START_FILING_EXPORT_QUEUE_WORKERS:-true}"
      # H2: single owner of the leader-locked cron jobs (keep this at 1 replica).
      RUN_SCHEDULER: "true"
    depends_on:
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - service-net
      - data-net
      - egress-net
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - ${BACKUP_ROOT:-/var/backups/contractdms}:${BACKUP_ROOT:-/var/backups/contractdms}:ro
    logging: *default-logging

  # Dedicated document extraction worker. Heavy OCR runs here so it does not
  # add sustained CPU to the request-serving backend container.
  document-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Release identity: baked into the image (revision label + RELEASE_SHA
      # environment) by backend/Dockerfile, never set at `up`, so a recreated
      # container cannot claim a release its code is not. Build with
      # RELEASE_SHA="$(git rev-parse HEAD)" (OPERATIONS 7a); unset, the image
      # says `unknown` and post_deploy_verify.sh fails.
      args:
        RELEASE_SHA: "${RELEASE_SHA:-unknown}"
    restart: unless-stopped
    command: ["python", "-m", "rbac_backend.worker"]
    environment:
      <<: *backend-env
      START_BACKGROUND_SERVICES: "false"
      START_CONTRACT_QUEUE_WORKERS: "false"
      START_DOCUMENT_EXTRACTION_WORKERS: "true"
      # Unified extraction rollout. Global switch off; organisations are opted
      # in one at a time through the allowlist. See
      # docs/operations/unified_extraction_canary_and_rollback.md
      UNIFIED_EXTRACTION_ENABLED: "${UNIFIED_EXTRACTION_ENABLED:-false}"
      UNIFIED_EXTRACTION_CANARY_ORG_IDS: "${UNIFIED_EXTRACTION_CANARY_ORG_IDS:-}"
      EXTRACTION_FALLBACK_ENABLED: "${EXTRACTION_FALLBACK_ENABLED:-false}"
      EXTRACTION_FALLBACK_MAX_PAGES_PER_DOCUMENT: "${EXTRACTION_FALLBACK_MAX_PAGES_PER_DOCUMENT:-5}"
      # Which pipeline versions this worker may claim. Defaults to legacy_v0,
      # NOT empty: empty means "claim anything", so an operator who starts a
      # canary and forgets to restrict this service would let it drain the
      # canary's unified_v1 queue. Defaulting closed means the canary is safe
      # even when this variable is omitted entirely.
      #
      # Consequence to know before global enablement: if
      # UNIFIED_EXTRACTION_ENABLED is ever set true without widening this,
      # unified jobs are created but never claimed and queue age grows. That is
      # deliberate - a visibly stalled queue is recoverable, a tenant silently
      # processed by the wrong pipeline is not. post_deploy_verify.sh checks
      # for exactly this combination.
      DOCUMENT_WORKER_PIPELINE_VERSIONS: "${DOCUMENT_WORKER_PIPELINE_VERSIONS:-legacy_v0}"
      # contract-worker is the single scheduler owner. Never flip this to true:
      # two schedulers double-fire cron jobs and the leader lock is a safety
      # net, not a licence.
      RUN_SCHEDULER: "false"
    depends_on:
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - service-net
      - data-net
      - egress-net
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    logging: *default-logging

  # Canary extraction worker. Scale to 1 ONLY during an authorised canary
  # window, with document-worker restricted to legacy_v0. Because the claim
  # predicate filters on the job's persisted pipeline_version, this worker
  # physically cannot claim another tenant's legacy job.
  #
  # Rollback is server-side: empty UNIFIED_EXTRACTION_CANARY_ORG_IDS so new
  # jobs are created legacy_v0, then scale this service back to 0. No image
  # redeploy, no page-evidence deletion.
  document-worker-canary:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Release identity: baked into the image (revision label + RELEASE_SHA
      # environment) by backend/Dockerfile, never set at `up`, so a recreated
      # container cannot claim a release its code is not. Build with
      # RELEASE_SHA="$(git rev-parse HEAD)" (OPERATIONS 7a); unset, the image
      # says `unknown` and post_deploy_verify.sh fails.
      args:
        RELEASE_SHA: "${RELEASE_SHA:-unknown}"
    restart: unless-stopped
    command: ["python", "-m", "rbac_backend.worker"]
    deploy:
      replicas: ${DOCUMENT_WORKER_CANARY_REPLICAS:-0}
    environment:
      <<: *backend-env
      START_BACKGROUND_SERVICES: "false"
      START_CONTRACT_QUEUE_WORKERS: "false"
      START_DOCUMENT_EXTRACTION_WORKERS: "true"
      UNIFIED_EXTRACTION_ENABLED: "${UNIFIED_EXTRACTION_ENABLED:-false}"
      UNIFIED_EXTRACTION_CANARY_ORG_IDS: "${UNIFIED_EXTRACTION_CANARY_ORG_IDS:-}"
      EXTRACTION_FALLBACK_ENABLED: "${EXTRACTION_FALLBACK_ENABLED:-false}"
      EXTRACTION_FALLBACK_MAX_PAGES_PER_DOCUMENT: "${EXTRACTION_FALLBACK_MAX_PAGES_PER_DOCUMENT:-5}"
      # The whole point of this service: it claims unified jobs and nothing else.
      DOCUMENT_WORKER_PIPELINE_VERSIONS: "unified_v1"
      RUN_SCHEDULER: "false"
    depends_on:
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - service-net
      - data-net
      - egress-net
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.12.5@sha256:05fecce7dce45d1254e0468bc037e8210e187fd56fa847688b012293d5f08aae
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required}"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: "INFO"
      QDRANT__STORAGE__SNAPSHOT_PATH: "/qdrant/snapshots"
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  falkordb:
    image: falkordb/falkordb:v4.0.8@sha256:af5f2aa035390f04fa6d1f0c6353669f5f75c101f6b4f385fcb672a288b4edb8
    restart: unless-stopped
    environment:
      FALKORDB_PASSWORD: "${FALKORDB_PASSWORD:?FALKORDB_PASSWORD is required}"
      # The FalkorDB image entrypoint loads the graph module, then appends
      # REDIS_ARGS. Overriding `command` starts plain Redis without FalkorDB.
      #
      # --dir is load-bearing. The image's WORKDIR is /FalkorDB and Redis
      # defaults `dir` to the working directory, so without this the RDB and
      # the AOF are written to the container's writable layer instead of the
      # mounted volume below. The backup then archives an empty /data, every
      # run reports success, and the graph does not survive the container
      # being replaced. Keep this path equal to the falkordb_data mount;
      # test_deployment_config.py fails when they diverge.
      REDIS_ARGS: >-
        --dir /data
        --save 900 1
        --save 300 10
        --appendonly yes
        --requirepass ${FALKORDB_PASSWORD:?FALKORDB_PASSWORD is required}
        --maxmemory 2gb
        --maxmemory-policy volatile-lru
    volumes:
      - falkordb_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -h localhost -a \"$${FALKORDB_PASSWORD}\" ping >/dev/null && redis-cli --no-auth-warning -h localhost -a \"$${FALKORDB_PASSWORD}\" COMMAND INFO GRAPH.QUERY | grep -qi graph.query"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    command:
      - sh
      - -c
      - redis-server --save 60 1 --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - redis_data:/data
    networks:
      - service-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  graphiti:
    profiles: ["graph-experimental"]
    build:
      context: ./services/graphiti
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GRAPHITI_DB_URL: "redis://:${FALKORDB_PASSWORD:?FALKORDB_PASSWORD is required}@falkordb:6379"
      GRAPHITI_QDRANT_URL: "http://qdrant:6333"
      GRAPHITI_QDRANT_API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required}"
      GRAPHITI_OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
      GRAPHITI_LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      GRAPHITI_GRAPH_NAME: "contraclaim"
    depends_on:
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    networks:
      - service-net
      - data-net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  clamav:
    # Pinned like every other image: AV is fail-closed in production, so an
    # unexpected upstream release must not be able to break uploads on redeploy.
    # R-A8Y: 1.4.6, the index digest R-A8X scanned (0 fixable CRITICAL/HIGH) and
    # the R-A8Y disposable drill validated. The tag itself is rebuilt upstream
    # (it already points elsewhere), so only the digest names these bytes.
    image: clamav/clamav:1.4.6@sha256:71fbb76b397cd84a90043caf1178a7f81bd0c131a031e7b0619afd721fbfad41
    restart: unless-stopped
    environment:
      # Signature checks per day. The image default is 1, which lets one missed
      # check leave the daily database ~48 h old - the freshness FAIL threshold
      # (scripts/check_clamav_signature_freshness.py). 12 is freshclam's own
      # documented default.
      FRESHCLAM_CHECKS: "12"
    deploy:
      resources:
        limits:
          # A concurrent database reload holds the old and new engine at once:
          # the R-A8Y drill peaked at 1952 MiB, 96 MiB under the former 2g. Now
          # that updates really happen, that reload runs every day.
          memory: 3g
    healthcheck:
      # Health is still "clamd answers PING". The rest heals a race measured in
      # the R-A8Y drill: the image's /init starts freshclam and clamd together,
      # freshclam can finish an update before clamd listens ("Clamd was NOT
      # notified"), clamd keeps the database it began loading, and its SelfCheck
      # then reports "Database status OK" - so it serves the old signatures until
      # the NEXT published daily. When the daily version on disk (CVD/CLD header
      # field 3) is newer than the one clamd reports loaded, ask for ONE RELOAD
      # (marker file); scanning continues during a concurrent reload. Fail
      # visible rather than heal silently: an unreadable VERSION is unhealthy,
      # and so is a newer database still not loaded 10 minutes after the
      # request - a reload that keeps failing is reported, never retried every
      # 15 s. test_clamav_update_path.py pins this; the R-A8Y drill ran it.
      test:
        - CMD-SHELL
        - >-
          clamdscan --ping=1 >/dev/null || exit 1;
          loaded=$$(printf 'zVERSION\0' | nc -w 5 127.0.0.1 3310 | tr -d '\0' | cut -d/ -f2);
          case "$$loaded" in ''|*[!0-9]*) echo "clamd VERSION unreadable: $$loaded"; exit 1;; esac;
          disk=0;
          for f in /var/lib/clamav/daily.cvd /var/lib/clamav/daily.cld; do
          [ -f "$$f" ] || continue;
          v=$$(head -c 512 "$$f" | cut -d: -f3);
          case "$$v" in ''|*[!0-9]*) continue;; esac;
          [ "$$v" -gt "$$disk" ] && disk=$$v;
          done;
          m=/tmp/.clamd-reload-requested;
          if [ "$$disk" -gt "$$loaded" ]; then
          if [ ! -e "$$m" ]; then touch "$$m"; clamdscan --reload >/dev/null 2>&1;
          elif [ -n "$$(find "$$m" -mmin +10)" ]; then echo "daily $$disk on disk but $$loaded loaded 10 min after RELOAD"; exit 1;
          fi;
          else rm -f "$$m";
          fi;
          exit 0
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    # R-A8Y: on service-net alone (internal: true) freshclam had no route and no
    # DNS, failed every daily check for 67 days, and clamd served the database
    # baked into the image. egress-net gives it the update path; every peer on
    # egress-net is already a peer on service-net, so no new service becomes
    # reachable. Never data-net or edge-net. test_clamav_update_path.py pins this.
    networks:
      - service-net
      - egress-net
    # Signatures survive container recreation. A new, empty volume is seeded by
    # Docker from the image's own /var/lib/clamav, so a fresh install starts
    # with the baked database and freshclam brings it current. Regenerable
    # cache: deliberately NOT part of the backup set.
    volumes:
      - clamav_db:/var/lib/clamav
    logging: *default-logging

  gateway:
    image: httpd:2.4@sha256:393435ee1a31437adeb1f03c134224c9ce5fa5f527e8c0cb9bea576b0d6fc742
    restart: unless-stopped
    depends_on:
      client:
        condition: service_healthy
      backend:
        condition: service_healthy
    # C1: the bundled gateway speaks plain HTTP only, while the backend enforces
    # AUTH_COOKIE_SECURE=true in production — so this port must never be the
    # public entry point. Default to loopback; a host reverse proxy (see
    # config/nginx-contraclaim.conf) terminates TLS on 443 and proxies here.
    # Only set HTTP_PORT=80 explicitly when an external load balancer already
    # terminates TLS in front of this host.
    ports:
      - "${HTTP_PORT:-127.0.0.1:8080}:80"
    volumes:
      - ./config/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./config/health.txt:/usr/local/apache2/htdocs/health.txt:ro
    networks:
      - edge-net
      - service-net
    healthcheck:
      # Real HTTP probe over /dev/tcp (the httpd image ships no curl/wget):
      # proves Apache is serving /health with a 200, not merely that the
      # health file exists on disk.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \" 200 \" <&3'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

volumes:
  backend_uploads:
  backend_logs:
  qdrant_data:
  qdrant_snapshots:
  falkordb_data:
  redis_data:
  clamav_db:

networks:
  data-net:
    driver: bridge
    internal: true
  service-net:
    driver: bridge
    internal: true
  edge-net:
    driver: bridge
  egress-net:
    driver: bridge
