ServerName *:80

LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule headers_module modules/mod_headers.so

LogFormat "%h %l %u %t "%r" %>s %b" common
CustomLog "/usr/local/apache2/logs/access.log" common
ErrorLog "/usr/local/apache2/logs/error.log"

ProxyRequests Off
ProxyPreserveHost On

<Proxy *>
    Require all granted
</Proxy>

# Backend API
ProxyPass        /api/ http://backend:8000/
ProxyPassReverse /api/ http://backend:8000/

# Graphiti knowledge graph
ProxyPass        /graphiti/ http://graphiti:8080/
ProxyPassReverse /graphiti/ http://graphiti:8080/

# LangGraph orchestrator (REST + websockets)
ProxyPass        /langgraph/ http://langgraph:9000/
ProxyPassReverse /langgraph/ http://langgraph:9000/
ProxyPass        /ws/ ws://langgraph:9000/ws/
ProxyPassReverse /ws/ ws://langgraph:9000/ws/

# Static frontend (catch-all)
ProxyPass        / http://client:5173/
ProxyPassReverse / http://client:5173/

# Local health endpoint
ProxyPass /health !
<Location /health>
    SetHandler server-status
    Require all granted
</Location>
