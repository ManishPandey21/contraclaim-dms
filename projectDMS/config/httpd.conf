ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

User daemon
Group daemon

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 300

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'self' blob: https://*.s3.ap-south-1.amazonaws.com https://s3.ap-south-1.amazonaws.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

<Proxy *>
    Require all granted
</Proxy>

Alias "/health" "/usr/local/apache2/htdocs/health.txt"
<Location "/health">
    Require all granted
</Location>

ProxyPass        /health !
ProxyPass        /api/ http://backend:8000/api/
ProxyPassReverse /api/ http://backend:8000/api/

ProxyPass        / http://client:5173/
ProxyPassReverse / http://client:5173/
