# Contraclaim DMS — host Nginx TLS termination (audit finding C1)
#
# The Docker stack's gateway (Apache httpd) listens on 127.0.0.1:8080 plain
# HTTP (docker-compose.prod.yml, HTTP_PORT default). This host-level Nginx
# server is the only public entry point: it terminates TLS on 443 and proxies
# everything to the gateway.
#
# Install:
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp config/nginx-contraclaim.conf /etc/nginx/sites-available/contraclaim
#   # edit server_name below to your real domain first
#   sudo ln -s /etc/nginx/sites-available/contraclaim /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.yourdomain.com
#
# certbot rewrites this file to add the 443 server block, certificates, and
# the HTTP->HTTPS redirect, and installs a systemd timer for renewal.

server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;   # <-- change me

    # Large scanned contract PDFs; must be >= GENERAL_UPLOAD_MAX_FILE_SIZE_MB.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: this is the first
        # trusted hop, so discard any client-supplied X-Forwarded-For. The
        # backend (uvicorn --proxy-headers) resolves the client IP from the
        # leftmost entry of this chain; appending to a spoofed header would
        # let an attacker choose their rate-limit bucket and audit identity.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket notifications (/ws).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Agentic AI endpoints (contract QA, letter drafting) are legitimately
        # multi-second; match the gateway's ProxyTimeout 300.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # Streamed uploads: pass chunks through instead of buffering to disk.
        proxy_request_buffering off;
    }
}
